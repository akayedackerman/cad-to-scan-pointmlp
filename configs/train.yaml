# PointMLP training on ModelNet40 (settings of the official PointMLP code)
#
# python scripts/train_pointmlp.py --config configs/train.yaml [--epochs 50 ...]

run_name: pointmlp_modelnet40_300ep    # outputs/training/<run_name>/

# data
train_file: data/processed/modelnet40_train_2048.h5   # made by scripts/prepare_data.py
test_file: data/processed/modelnet40_test_full_1024.h5  # made by scripts/make_hpr_testset.py
num_points: 1024
num_classes: 40

# augmentation
scale_low: 0.6667         # per-axis scale U[2/3, 3/2]
scale_high: 1.5
shift_range: 0.2          # per-axis shift U[-0.2, 0.2]

# model
model: pointMLP           # pointMLP or pointMLPElite

# optimisation
epochs: 300
batch_size: 32
learning_rate: 0.1        # SGD
momentum: 0.9
weight_decay: 0.0002
min_lr: 0.005             # cosine schedule
label_smoothing: 0.2
grad_clip: 1.0            # gradient norm clipping

# runtime
workers: 8
seed: null                # integer for deterministic runs
eval_every: 1             # test every N epochs
